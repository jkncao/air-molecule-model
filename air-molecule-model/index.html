<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();
</script>

          isStatic: true,
          col: col === 1 ? 'A' : (col === 0 ? 'B' : 'C'),
          origCol: col === 1 ? 'A' : (col === 0 ? 'B' : 'C'),
          relX: minX + Math.random() * (maxX - minX),
          relY: 0.06 + Math.pow(Math.random(), 0.8) * 0.84,
          vx: 0, vy: 0,
          radius: 1.6 + Math.random() * 0.8,
          minX: minX,
          maxX: maxX
        });
      }

      for (let i = 0; i < DYNAMIC_COUNT; i++) {
        const colIdx = i % 3;
        const col = colIdx === 1 ? 'A' : (colIdx === 0 ? 'B' : 'C');
        let minX, maxX;
        if (col === 'B') { minX = P_B_X0; maxX = P_B_X1; }
        else if (col === 'A') { minX = P_A_X0; maxX = P_A_X1; }
        else { minX = P_C_X0; maxX = P_C_X1; }

        const relY = 0.32 + Math.random() * 0.56;
        const relX = minX + Math.random() * (maxX - minX);

        particles.push({
          isStatic: false,
          col: col,
          origCol: col,
          relX: relX,
          relY: relY,
          initRelX: relX,
          initRelY: relY,
          vx: 0, vy: 0,
          radius: 2.2 + Math.random() * 0.6,
          seedX: Math.random(),
          seedY: Math.random(),
          loopT: 0,
          loopSide: Math.random() < 0.5 ? -1 : 1,
          loopOffX: (Math.random() - 0.5) * 0.08,
          loopOffY: (Math.random() - 0.5) * 0.05
        });
      }

      for (let k = 0; k < 30; k++) separateParticles();
      clampParticles();
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = container.clientWidth || 600;
      h = container.clientHeight || 480;

      if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function separateParticles() {
      const cols = Math.ceil(w / SEP_CELL) + 1;
      const rows = Math.ceil(h / SEP_CELL) + 1;

      if (cols !== sepCols || rows !== sepRows) {
        sepCols = cols; sepRows = rows;
        sepBuckets = new Array(cols * rows);
        for (let i = 0; i < sepBuckets.length; i++) sepBuckets[i] = [];
      } else {
        for (let i = 0; i < sepBuckets.length; i++) {
          if (sepBuckets[i].length) sepBuckets[i].length = 0;
        }
      }

      const n = particles.length;

      for (let i = 0; i < n; i++) {
        const p = particles[i];
        let cx = Math.floor(p.relX * w / SEP_CELL);
        let cy = Math.floor(p.relY * h / SEP_CELL);
        if (cx < 0) cx = 0; else if (cx >= cols) cx = cols - 1;
        if (cy < 0) cy = 0; else if (cy >= rows) cy = rows - 1;
        p._cx = cx; p._cy = cy;
        sepBuckets[cy * cols + cx].push(i);
      }

      for (let i = 0; i < n; i++) {
        const pi = particles[i];
        const cx = pi._cx, cy = pi._cy;

        for (let oy = -1; oy <= 1; oy++) {
          const ny = cy + oy;
          if (ny < 0 || ny >= rows) continue;
          const rowBase = ny * cols;

          for (let ox = -1; ox <= 1; ox++) {
            const nx = cx + ox;
            if (nx < 0 || nx >= cols) continue;

            const bucket = sepBuckets[rowBase + nx];
            const bl = bucket.length;

            for (let k = 0; k < bl; k++) {
              const j = bucket[k];
              if (j <= i) continue;
              const pj = particles[j];

              let dx = (pj.relX - pi.relX) * w;
              let dy = (pj.relY - pi.relY) * h;

              const minD = pi.radius + pj.radius + SEP_GAP;
              const d2 = dx * dx + dy * dy;
              if (d2 >= minD * minD) continue;

              let d = Math.sqrt(d2);
              if (d < 1e-4) {
                const a = Math.random() * Math.PI * 2;
                dx = Math.cos(a); dy = Math.sin(a); d = 1;
              }

              const overlap = minD - d;
              const ux = dx / d;
              const uy = dy / d;

              const piDragged = !!pi.isDragged;
              const pjDragged = !!pj.isDragged;

              if (piDragged && pjDragged) continue;

              if (piDragged) {
                pj.relX += ux * overlap * SEP_RELAX / w;
                pj.relY += uy * overlap * SEP_RELAX / h;
              } else if (pjDragged) {
                pi.relX -= ux * overlap * SEP_RELAX / w;
                pi.relY -= uy * overlap * SEP_RELAX / h;
              } else {
                const push = overlap * 0.5 * SEP_RELAX;
                pi.relX -= ux * push / w;
                pi.relY -= uy * push / h;
                pj.relX += ux * push / w;
                pj.relY += uy * push / h;
              }
            }
          }
        }
      }
    }

    function clampParticles() {
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.isStatic) {
          if (p.relX < p.minX) p.relX = p.minX;
          else if (p.relX > p.maxX) p.relX = p.maxX;
          if (p.relY < 0.04) p.relY = 0.04;
          else if (p.relY > 0.92) p.relY = 0.92;
        } else {
          if (p.isDragged) continue;
          if (p.relX < 0.05) p.relX = 0.05;
          else if (p.relX > 0.95) p.relX = 0.95;
          if (p.relY < 0.04) p.relY = 0.04;
          else if (p.relY > 0.88) p.relY = 0.88;
        }
      }
    }

    function loopPosition(p, t) {
      const side = p.loopSide;
      const sideX = 0.5 + side * 0.28;
      const topY = 0.32 + p.loopOffY;
      const botY = 0.84 + p.loopOffY;
      const midX = 0.5 + p.loopOffX;

      if (t < 0.25) {
        const k = t / 0.25;
        return {
          x: midX + Math.sin(k * Math.PI) * 0.02 * side,
          y: botY + (topY - botY) * k
        };
      } else if (t < 0.5) {
        const k = (t - 0.25) / 0.25;
        return {
          x: midX + (sideX - midX) * k,
          y: topY + Math.sin(k * Math.PI) * (-0.015)
        };
      } else if (t < 0.75) {
        const k = (t - 0.5) / 0.25;
        return {
          x: sideX + Math.sin(k * Math.PI) * 0.02 * (-side),
          y: topY + (botY - topY) * k
        };
      } else {
        const k = (t - 0.75) / 0.25;
        return {
          x: sideX + (midX - sideX) * k,
          y: botY + Math.sin(k * Math.PI) * 0.015
        };
      }
    }

    // ================================================================
    // ★ 进入阶段 4 时，根据每个分子的当前位置，
    //   把它放到环路上最匹配的相位上——这样从阶段 3 过渡到阶段 4
    //   看起来就像「A 区底部空气受热上升、自然汇入循环」。
    //   · A 区近地面   → 上升段 (loopT ≈ 0~0.20)
    //   · A 区高空     → 顶部扩散段 (loopT ≈ 0.28~0.38)
    //   · B/C 区高空   → 顶部下沉段 (loopT ≈ 0.52~0.66)
    //   · B/C 区近地面 → 底部回流段 (loopT ≈ 0.80~0.92)
    // ================================================================
    function initLoopPhaseFromPositions() {
      particles.forEach(p => {
        if (p.isStatic) return;

        const inA = p.relX > 0.36 && p.relX < 0.64;
        const inB = p.relX < 0.36;

        // 循环侧：B 用 -1，C 用 +1
        if (p.origCol === 'B') p.loopSide = -1;
        else if (p.origCol === 'C') p.loopSide = 1;
        else p.loopSide = (p.relX < 0.5) ? -1 : 1;

        const isHigh = p.relY < 0.50;

        if (inA) {
          if (isHigh) {
            p.loopT = 0.28 + Math.random() * 0.10;
          } else {
            p.loopT = 0.02 + Math.random() * 0.18;
          }
        } else {
          if (isHigh) {
            p.loopT = 0.52 + Math.random() * 0.14;
          } else {
            p.loopT = 0.80 + Math.random() * 0.12;
          }
        }
      });
    }

    function updatePhysics() {
      const stage = state.stage;
      const isPlaying = state.isPlaying;
      const ease = 0.022 * state.speed;

      particles.forEach(p => {
        if (p.isDragged) return;

        if (p.isStatic) {
          p.relX += (Math.random() - 0.5) * 0.0003;
          p.relY += (Math.random() - 0.5) * 0.0003;
          if (p.relY < 0.04) p.relY = 0.04;
          if (p.relY > 0.92) p.relY = 0.92;
          return;
        }

        if (!isPlaying) return;
        if (state.freeMode) return;

        if (stage === 0) {
          const homeEase = 0.03 * state.speed;
          p.relX += (p.initRelX - p.relX) * homeEase;
          p.relY += (p.initRelY - p.relY) * homeEase;
          p.col = p.origCol;
          return;
        }

        let targetX, targetY;

        if (stage === 1) {
          if (p.origCol === 'A') {
            targetY = 0.28 + p.seedY * 0.12;
            targetX = p.initRelX + (p.seedX - 0.5) * 0.04;
            p.col = 'A';
          } else {
            targetY = 0.64 + p.seedY * 0.22;
            targetX = p.initRelX + (p.seedX - 0.5) * 0.04;
            p.col = p.origCol;
          }
          p.relX += (targetX - p.relX) * ease;
          p.relY += (targetY - p.relY) * ease;
        }
        else if (stage === 2) {
          if (p.origCol === 'A') {
            const goLeft = p.seedX < 0.5;
            if (goLeft) {
              targetX = 0.13 + p.seedY * 0.14;
              targetY = 0.28 + p.seedX * 0.12;
            } else {
              targetX = 0.73 + p.seedY * 0.14;
              targetY = 0.28 + p.seedX * 0.12;
            }
            if (Math.abs(p.relX - targetX) < 0.08) {
              p.col = goLeft ? 'B' : 'C';
            } else {
              p.col = 'A';
            }
          } else {
            targetY = 0.64 + p.seedY * 0.22;
            targetX = p.initRelX + (p.seedX - 0.5) * 0.04;
            p.col = p.origCol;
          }
          p.relX += (targetX - p.relX) * ease;
          p.relY += (targetY - p.relY) * ease;
        }
        else if (stage === 3) {
          const isHighAlt = p.relY < Y_HIGH_BOUNDARY;
          if (isHighAlt) {
            p.relX += (Math.random() - 0.5) * 0.00015;
            p.relY += (Math.random() - 0.5) * 0.00015;
            return;
          }
          targetY = 0.66 + p.seedY * 0.20;
          targetX = 0.40 + p.seedX * 0.20;
          if (Math.abs(p.relX - targetX) < 0.06) {
            p.col = 'A';
          } else {
            p.col = p.origCol;
          }
          p.relX += (targetX - p.relX) * ease;
          p.relY += (targetY - p.relY) * ease;
        }
        else if (stage === 4) {
          p.loopT = (p.loopT + 0.0022 * state.speed) % 1;
          const pos = loopPosition(p, p.loopT);
          const follow = 0.08 * state.speed;
          p.relX += (pos.x - p.relX) * follow;
          p.relY += (pos.y - p.relY) * follow;

          if (p.loopT < 0.22 || p.loopT > 0.82) {
            p.col = 'A';
          } else {
            p.col = p.loopSide < 0 ? 'B' : 'C';
          }
        }
      });

      separateParticles();
      clampParticles();
    }

    let upperBulge = 0;
    let lowerBulge = 0;

    function updateIsobars() {
      let targetUpper = 0;
      let targetLower = 0;

      if (state.stage === 0 || state.freeMode) {
        targetUpper = 0;
        targetLower = 0;
      } else if (state.stage === 1) {
        targetUpper = 0.35; targetLower = -0.15;
      } else if (state.stage === 2) {
        targetUpper = 1.0; targetLower = -0.3;
      } else if (state.stage === 3) {
        targetUpper = 0.8; targetLower = 1.0;
      } else if (state.stage === 4) {
        targetUpper = 1.0; targetLower = 1.0;
      }

      upperBulge += (targetUpper - upperBulge) * 0.05;
      lowerBulge += (targetLower - lowerBulge) * 0.05;
    }

    function render() {
      resizeCanvas();
      ctx.clearRect(0, 0, w, h);

      const textVarColor = getCssVar('--on-surface-variant') || 'rgba(0,0,0,0.55)';
      const strokeDefault = getCssVar('--stroke-default') || '#e3e3e3';
      const primaryColor = getCssVar('--primary') || '#3186ff';

      const chart1 = getCssVar('--chart-1') || '#2575fc';
      const chart7 = getCssVar('--chart-7') || '#2780c4';
      const chart10 = getCssVar('--chart-10') || '#c84288';
      const chart8 = getCssVar('--chart-8') || '#997112';

      const colWidth = w * COL_WIDTH;
      const colB_x = w * COL_B_X0;
      const colA_x = w * COL_A_X0;
      const colC_x = w * COL_C_X0;

      const yGround = h * Y_GROUND;
      const y23 = h * Y23;

      ctx.beginPath();
      ctx.moveTo(0, yGround);
      ctx.lineTo(w, yGround);
      ctx.strokeStyle = strokeDefault;
      ctx.lineWidth = 2;
      ctx.stroke();

      const colsInfo = [
        { x: colB_x, type: 'cold' },
        { x: colA_x, type: 'hot' },
        { x: colC_x, type: 'cold' }
      ];

      colsInfo.forEach(c => {
        ctx.fillStyle = c.type === 'hot' ? 'rgba(200, 66, 136, 0.04)' : 'rgba(39, 128, 196, 0.04)';
        ctx.fillRect(c.x, 20, colWidth, yGround - 20);

        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = strokeDefault;
        ctx.moveTo(c.x, 20);
        ctx.lineTo(c.x, yGround);
        ctx.moveTo(c.x + colWidth, 20);
        ctx.lineTo(c.x + colWidth, yGround);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = c.type === 'hot' ? 'rgba(200, 66, 136, 0.12)' : 'rgba(39, 128, 196, 0.12)';
        ctx.fillRect(c.x + 4, yGround + 6, colWidth - 8, 26);

        ctx.font = "bold 11px 'Google Sans Flex', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillStyle = c.type === 'hot' ? chart10 : chart7;
        ctx.fillText(c.type === 'hot' ? '受热区' : '受冷区', c.x + colWidth / 2, yGround + 23);
      });

      ctx.beginPath();
      ctx.setLineDash([2, 4]);
      ctx.strokeStyle = textVarColor;
      ctx.lineWidth = 1;
      ctx.moveTo(0, y23);
      ctx.lineTo(w, y23);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = "italic 11px 'Google Sans Code', monospace";
      ctx.fillStyle = textVarColor;
      ctx.textAlign = 'right';
      ctx.fillText("下 2/3 环流高空界面", w - 10, y23 - 6);

      particles.forEach(p => {
        if (!state.showAllParticles && p.isStatic) return;

        const px = p.relX * w;
        const py = p.relY * h;

        if (p.isDragged) {
          ctx.beginPath();
          ctx.arc(px, py, p.radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = chart10;
          ctx.globalAlpha = 0.20;
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(px, py, p.radius, 0, Math.PI * 2);

        if (p.isStatic) {
          ctx.fillStyle = chart1;
          ctx.globalAlpha = 0.25;
        } else if (p.isDragged) {
          ctx.globalAlpha = 1.0;
          ctx.fillStyle = chart10;
        } else {
          ctx.globalAlpha = 0.85;
          if (p.col === 'A') ctx.fillStyle = chart10;
          else ctx.fillStyle = chart7;
        }
        ctx.fill();

        if (p.isDragged) {
          ctx.strokeStyle = chart10;
          ctx.lineWidth = 1.8;
          ctx.stroke();
        }

        ctx.globalAlpha = 1.0;
      });

      ctx.beginPath();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = chart8;

      const upperAmp = 22 * upperBulge;
      ctx.moveTo(0, y23);
      ctx.bezierCurveTo(
        colB_x + colWidth / 2, y23 + upperAmp * 0.6,
        colA_x, y23 - upperAmp,
        colA_x + colWidth / 2, y23 - upperAmp
      );
      ctx.bezierCurveTo(
        colA_x + colWidth, y23 - upperAmp,
        colC_x + colWidth / 2, y23 + upperAmp * 0.6,
        w, y23
      );
      ctx.stroke();

      ctx.fillStyle = chart8;
      ctx.font = "bold 11px 'Google Sans Code', monospace";
      ctx.textAlign = 'left';
      ctx.fillText("2/3 高空等压面 P₂", 12, y23 - 8);

      const ySurfIso = yGround - 25;
      const lowerAmp = 18 * lowerBulge;

      ctx.beginPath();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = chart8;

      ctx.moveTo(0, ySurfIso);
      ctx.bezierCurveTo(
        colB_x + colWidth / 2, ySurfIso - lowerAmp * 0.6,
        colA_x, ySurfIso + lowerAmp,
        colA_x + colWidth / 2, ySurfIso + lowerAmp
      );
      ctx.bezierCurveTo(
        colA_x + colWidth, ySurfIso + lowerAmp,
        colC_x + colWidth / 2, ySurfIso - lowerAmp * 0.6,
        w, ySurfIso
      );
      ctx.stroke();

      ctx.fillText("近地面等压面 P₁", 12, ySurfIso - 8);

      if (state.hoverRegion && !dragState.isDragging) {
        const { col, level } = state.hoverRegion;
        let rx = col === 'B' ? colB_x : (col === 'A' ? colA_x : colC_x);
        let ry = level === 'high' ? 20 : y23;
        let rh = level === 'high' ? (y23 - 20) : (yGround - y23);

        ctx.fillStyle = primaryColor;
        ctx.globalAlpha = 0.08;
        ctx.fillRect(rx, ry, colWidth, rh);
        ctx.globalAlpha = 1.0;

        ctx.strokeStyle = primaryColor;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(rx, ry, colWidth, rh);
      }

      // 画笔笔记（画在最上层）
      if (strokes.length) {
        const inkColor = getCssVar('--on-surface') || '#000000';
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = inkColor;
        ctx.lineWidth = 2.5;
        for (let s = 0; s < strokes.length; s++) {
          const pts = strokes[s].points;
          if (pts.length < 1) continue;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) {
            ctx.lineTo(pts[i].x, pts[i].y);
          }
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    const PICK_RADIUS_PX = 18;
    const BRUSH_RADIUS_PX = 55;

    function canvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      return {
        x: x,
        y: y,
        relX: x / w,
        relY: y / h
      };
    }

    function findNearestParticle(relX, relY, maxDistPx) {
      let best = null;
      let bestDist = maxDistPx;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.isStatic) continue;
        const dx = (p.relX - relX) * w;
        const dy = (p.relY - relY) * h;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < bestDist) {
          bestDist = d;
          best = p;
        }
      }
      return best;
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const coords = canvasCoords(e);

      if (state.penMode) {
        const stroke = { points: [{ x: coords.x, y: coords.y }] };
        strokes.push(stroke);
        dragState.currentStroke = stroke;
        dragState.isDrawing = true;
        canvas.setPointerCapture(e.pointerId);
        return;
      }

      const captured = [];
      const offsets = [];

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.isStatic) continue;
        const dx = (p.relX - coords.relX) * w;
        const dy = (p.relY - coords.relY) * h;
        if (dx * dx + dy * dy <= BRUSH_RADIUS_PX * BRUSH_RADIUS_PX) {
          captured.push(p);
          offsets.push({ relX: p.relX - coords.relX, relY: p.relY - coords.relY });
        }
      }

      if (captured.length) {
        captured.forEach(p => { p.isDragged = true; });
        dragState.particles = captured;
        dragState.offsets = offsets;
        dragState.isDragging = true;

        canvas.setPointerCapture(e.pointerId);
        canvas.style.cursor = 'grabbing';

        dragHint.classList.add('hidden');
        dragCounter.classList.add('visible');
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      const coords = canvasCoords(e);
      state.mouseX = coords.x;
      state.mouseY = coords.y;

      if (state.penMode) {
        if (dragState.isDrawing && dragState.currentStroke) {
          const pts = dragState.currentStroke.points;
          const last = pts[pts.length - 1];
          const dx = coords.x - last.x;
          const dy = coords.y - last.y;
          if (dx * dx + dy * dy > 4) {
            pts.push({ x: coords.x, y: coords.y });
          }
        }
        return;
      }

      if (dragState.isDragging) {
        const captured = dragState.particles;
        const offsets = dragState.offsets;
        for (let i = 0; i < captured.length; i++) {
          const p = captured[i];
          const off = offsets[i];
          p.relX = coords.relX + off.relX;
          p.relY = coords.relY + off.relY;

          p.relX = Math.max(0.02, Math.min(0.98, p.relX));
          p.relY = Math.max(0.03, Math.min(0.90, p.relY));
        }
        return;
      }

      const hover = findNearestParticle(coords.relX, coords.relY, PICK_RADIUS_PX);
      dragState.hoverTarget = hover;
      canvas.style.cursor = hover ? 'grab' : 'crosshair';

      const colWidth = w * COL_WIDTH;
      const colB_x = w * COL_B_X0;
      const colA_x = w * COL_A_X0;
      const colC_x = w * COL_C_X0;
      const y23 = h * Y23;
      const yGround = h * Y_GROUND;

      let detected = null;
      if (coords.y >= 20 && coords.y <= yGround) {
        let col = null;
        if (coords.x >= colB_x && coords.x <= colB_x + colWidth) col = 'B';
        else if (coords.x >= colA_x && coords.x <= colA_x + colWidth) col = 'A';
        else if (coords.x >= colC_x && coords.x <= colC_x + colWidth) col = 'C';

        if (col) {
          let level = coords.y < y23 ? 'high' : 'low';
          detected = { col, level };
        }
      }

      state.hoverRegion = detected;
    });

    function endDrag(e) {
      if (dragState.isDrawing) {
        dragState.isDrawing = false;
        dragState.currentStroke = null;
        return;
      }
      if (!dragState.isDragging) return;
      dragState.particles.forEach(p => {
        p.col = p.origCol;
        p.isDragged = false;
      });
      dragState.particles = [];
      dragState.offsets = [];
      dragState.isDragging = false;
      canvas.style.cursor = 'crosshair';
      dragCounter.classList.remove('visible');
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', (e) => {
      if (dragState.isDragging) return;
      state.hoverRegion = null;
    });

    canvas.addEventListener('touchstart', (e) => {
      if (dragState.isDragging) e.preventDefault();
    }, { passive: false });

    function animationLoop() {
      updatePhysics();
      updateIsobars();
      render();
      requestAnimationFrame(animationLoop);
    }

    resizeCanvas();
    initParticles();
    window.addEventListener('resize', resizeCanvas);
    requestAnimationFrame(animationLoop);

    setTimeout(() => dragHint.classList.add('hidden'), 8000);

    function setStage(stageIdx) {
      const wasStage = state.stage;
      state.stage = stageIdx;

      // ★ 进入阶段 4 时：根据每个分子的当前位置，把它放入环路的合适相位，
      //    使 A 区底部空气自然受热上升并汇入循环。
      if (stageIdx === 4 && wasStage !== 4) {
        initLoopPhaseFromPositions();
      }

      document.querySelectorAll('.stage-btn').forEach(btn => {
        btn.classList.toggle('is-active', parseInt(btn.dataset.stage) === stageIdx);
      });

      const meta = STAGE_META[stageIdx];
      document.getElementById('statusText').textContent = `阶段 ${stageIdx}: ${meta.title.split(':')[1]}`;
      document.getElementById('infoTitle').textContent = meta.title;
      document.getElementById('infoProgress').textContent = meta.progress;
      document.getElementById('infoDesc').textContent = meta.desc;
    }

    document.getElementById('stageNav').addEventListener('click', (e) => {
      const btn = e.target.closest('.stage-btn');
      if (btn) {
        setStage(parseInt(btn.dataset.stage));
      }
    });

    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      state.isPlaying = !state.isPlaying;
      if (playBtn) playBtn.textContent = state.isPlaying ? '暂停' : '播放';
      const statusDot = document.getElementById('statusDot');
      statusDot.style.background = state.isPlaying ? 'var(--primary, #3186ff)' : 'var(--on-surface-variant)';
      statusDot.style.boxShadow = state.isPlaying ? '0 0 6px var(--primary, #3186ff)' : 'none';
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      dragState.particles.forEach(p => { p.isDragged = false; });
      dragState.particles = [];
      dragState.offsets = [];
      dragState.isDragging = false;
      initParticles();
      setStage(0);
      if (!state.isPlaying) {
        state.isPlaying = true;
        if (playBtn) playBtn.textContent = '暂停';
      }
    });

    const freeBtn = document.getElementById('freeBtn');
    freeBtn.addEventListener('click', () => {
      state.freeMode = !state.freeMode;
      freeBtn.classList.toggle('is-active', state.freeMode);
      if (state.freeMode) {
        freeBtn.textContent = '自由拖动模式 (开)';
        document.getElementById('statusText').textContent = '自由拖动模式';
        document.getElementById('infoTitle').textContent = '自由拖动模式';
        document.getElementById('infoProgress').textContent = '所有阶段物理暂停';
        document.getElementById('infoDesc').textContent = '按住并拖动会连带周围一片分子一起移动，观察它们因防重叠约束推开邻近分子。松手后分子保留在当前位置。';
      } else {
        freeBtn.textContent = '自由拖动模式';
        setStage(state.stage);
      }
    });

    const particleToggle = document.getElementById('particleToggle');
    particleToggle.addEventListener('click', () => {
      state.showAllParticles = !state.showAllParticles;
      particleToggle.classList.toggle('is-active', state.showAllParticles);
      document.getElementById('toggleText').textContent = state.showAllParticles
        ? "显现: 全部微粒"
        : "显现: 仅动态微粒";
    });

    // ================================================================
    // 分子运动速度调节
    // ================================================================
    const SPEED_STEPS = [0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4];
    const speedValueEl = document.getElementById('speedValue');
    const slowBtn = document.getElementById('slowBtn');
    const fastBtn = document.getElementById('fastBtn');

    function formatSpeed(m) {
      return (Math.round(m * 100) / 100) + '×';
    }

    function updateSpeedUI() {
      const i = SPEED_STEPS.indexOf(state.speed);
      speedValueEl.textContent = formatSpeed(state.speed);
      slowBtn.disabled = i <= 0;
      fastBtn.disabled = i >= SPEED_STEPS.length - 1;
    }

    function stepSpeed(delta) {
      const i = SPEED_STEPS.indexOf(state.speed);
      const ni = Math.max(0, Math.min(SPEED_STEPS.length - 1, i + delta));
      if (ni === i) return;
      state.speed = SPEED_STEPS[ni];
      updateSpeedUI();
    }

    slowBtn.addEventListener('click', () => stepSpeed(-1));
    fastBtn.addEventListener('click', () => stepSpeed(1));
    speedValueEl.addEventListener('click', () => {
      state.speed = 1;
      updateSpeedUI();
    });
    updateSpeedUI();

    // ================================================================
    // 画笔笔记模式
    // ================================================================
    const penBtn = document.getElementById('penBtn');
    const clearNotesBtn = document.getElementById('clearNotesBtn');

    penBtn.addEventListener('click', () => {
      state.penMode = !state.penMode;
      penBtn.classList.toggle('is-active', state.penMode);
      if (state.penMode) {
        penBtn.textContent = '画笔模式 (开)';
        canvas.style.cursor = 'crosshair';
      } else {
        penBtn.textContent = '画笔模式';
        canvas.style.cursor = 'crosshair';
      }
    });

    clearNotesBtn.addEventListener('click', () => {
      strokes = [];
    });

    const applyTheme = t => {
      document.documentElement.setAttribute('data-theme', t);
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }
    window.addEventListener('message', e => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') applyTheme(e.data.theme);
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>

<script>/*luminous-slider-normalizer*/(function(){function f(r){if(!r||r.type!=='range')return;var mn=parseFloat(r.min||'0'),mx=parseFloat(r.max||'100'),v=parseFloat(r.value);if(isNaN(v))v=(mn+mx)/2;var p=mx>mn?((v-mn)/(mx-mn))*100:50;r.style.setProperty('--progress',p+'%');r.style.removeProperty('--slider-fill');}function all(){document.querySelectorAll('input[type="range"], .lumi-slider').forEach(f);}document.addEventListener('input',function(e){f(e.target);});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',all);else all();})();</script>
</body>
